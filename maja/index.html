        // ==========================================

                uploadLabel.style.display = 'flex';

        window.handleImageUpload = (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    if (!userUploadedImages[currentImageTaskId]) userUploadedImages[currentImageTaskId] = [];
                    userUploadedImages[currentImageTaskId].push(reader.result);
                    imageCarouselIndex[currentImageTaskId] = userUploadedImages[currentImageTaskId].length - 1;
                    localStorage.setItem('maja_bass_user_images', JSON.stringify(userUploadedImages));
                    renderGallery();
                    renderApp(); // Update button text
                };
                reader.readAsDataURL(file);
            });
        };

        window.changeImageSlide = (direction) => {
            if (!currentImageTaskId) return;
            const images = userUploadedImages[currentImageTaskId] || [];
            if (!images.length) return;
            const total = images.length;
            const currentIndex = imageCarouselIndex[currentImageTaskId] || 0;
            const nextIndex = (currentIndex + direction + total) % total;
            imageCarouselIndex[currentImageTaskId] = nextIndex;
            renderGallery();
        };

        window.setImageSlide = (index) => {
            if (!currentImageTaskId) return;
            const images = userUploadedImages[currentImageTaskId] || [];
            if (!images.length) return;
            imageCarouselIndex[currentImageTaskId] = Math.max(0, Math.min(index, images.length - 1));
            renderGallery();
        };

        window.toggleVideoDropdown = (event, taskId) => {
            event.stopPropagation();
            videoDropdownTaskId = videoDropdownTaskId === taskId ? null : taskId;
            renderApp();
        };

        window.openVideoLink = (event, url) => {
            event.stopPropagation();
            window.open(url, '_blank');
            videoDropdownTaskId = null;
            renderApp();
        };

        // --- VIDÉO (lecteur intégré) ---
        window.openVideoModal = (event, url, title) => {
            event.stopPropagation();
            const modal = document.getElementById('video-modal');
            const player = document.getElementById('video-modal-player');
            document.getElementById('video-modal-title').innerText = title || 'Vidéo';
            if (player.getAttribute('src') !== url) player.setAttribute('src', url);
            modal.classList.remove('hidden');
            const p = player.play();
            if (p && p.catch) p.catch(() => {});
        };

        window.closeVideoModal = () => {
            const player = document.getElementById('video-modal-player');
            player.pause();
            if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
            document.getElementById('video-modal').classList.add('hidden');
        };

        document.getElementById('video-modal').addEventListener('click', (e) => {
            if (e.target.id === 'video-modal') window.closeVideoModal();
        });

        (() => {
            const v = document.getElementById('video-modal-player');
            const btn = document.getElementById('vp-play');
            const seek = document.getElementById('vp-seek');
            const time = document.getElementById('vp-time');
            const fmt = (t) => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
            const toggle = () => { if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); } else { v.pause(); } };
            let dragging = false;
            const update = () => {
                btn.innerHTML = v.paused ? '&#9654;' : '&#10074;&#10074;';
                if (!dragging && v.duration) seek.value = Math.round(v.currentTime / v.duration * 1000);
                time.textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration);
            };
            btn.addEventListener('click', toggle);
            v.addEventListener('click', toggle);
            ['play', 'pause', 'timeupdate', 'loadedmetadata', 'emptied'].forEach(ev => v.addEventListener(ev, update));
            seek.addEventListener('input', () => { dragging = true; if (v.duration) time.textContent = fmt(seek.value / 1000 * v.duration) + ' / ' + fmt(v.duration); });
            seek.addEventListener('change', () => { if (v.duration) v.currentTime = seek.value / 1000 * v.duration; dragging = false; });
            const box = document.getElementById('vp-box');
            const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
            let idleTimer = null;
            const wake = () => {
                box.classList.remove('vp-idle');
                clearTimeout(idleTimer);
                if (fsEl() === box) idleTimer = setTimeout(() => box.classList.add('vp-idle'), 2500);
            };
            ['pointermove', 'pointerdown', 'touchstart'].forEach(ev => box.addEventListener(ev, wake, { passive: true }));
            const onFs = () => {
                if (fsEl() === box) { wake(); try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }
                else { clearTimeout(idleTimer); box.classList.remove('vp-idle'); try { screen.orientation.unlock(); } catch (e) {} }
            };
            document.addEventListener('fullscreenchange', onFs);
            document.addEventListener('webkitfullscreenchange', onFs);
            document.getElementById('vp-fs').addEventListener('click', () => {
                if (fsEl()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
                if (box.requestFullscreen) box.requestFullscreen().catch(() => {});
                else if (box.webkitRequestFullscreen) box.webkitRequestFullscreen();
                else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
            });
        })();

        // --- [claude] base / toutes les variantes (Leçon 22) ---
        window.toggleVariants = () => {
            const on = document.body.classList.toggle('show-all');
            try { localStorage.setItem('maja-show-all', on ? '1' : '0'); } catch (e) {}
        };
        try { if (localStorage.getItem('maja-show-all') === '1') document.body.classList.add('show-all'); } catch (e) {}

        window.setTheory = (which) => { document.body.classList.toggle('th-classic-on', which === 'classic'); };

        // --- MODES ---
        window.openModeModal = (e, lessonId, modeId) => {
            e.stopPropagation();
            const lesson = COURSE_DATA.flatMap(m => m.lessons).find(l => l.id === lessonId);
            if (!lesson || !lesson.modes) return;
            const mode = lesson.modes.find(m => m.id === modeId);
            if (!mode) return;
            
            currentMode = mode;
            document.getElementById('mode-modal-title').innerText = mode.name;
            const modal = document.getElementById('mode-modal');
            modal.classList.remove('hidden');
            modal.querySelector('.modal-content').scrollTop = 0;
            renderModeContent();
        };

        window.closeModeModal = () => {
            document.getElementById('mode-modal').classList.add('hidden');
            currentMode = null;
        };

        window.renderModeContent = () => {
            if (!currentMode) return;
            const content = document.getElementById('mode-modal-content');
            
            content.innerHTML = `
                <div class="space-y-6">
                    <div>
                        <h4 class="text-lg font-semibold text-violet-400 mb-3 flex items-center gap-2">
                            <i data-lucide="heart" class="w-5 h-5"></i>
                            Sensations clés
                        </h4>
                        <div class="flex flex-wrap gap-2">
                            ${currentMode.sensations.map(sensation => `
                                <span class="px-3 py-1.5 bg-slate-800/60 border border-slate-700 rounded-lg text-sm text-slate-300">
                                    ${sensation}
                                </span>
                            `).join('')}
                        </div>
                    </div>
                    
                    <div>
                        <h4 class="text-lg font-semibold text-violet-400 mb-3 flex items-center gap-2">
                            <i data-lucide="music-2" class="w-5 h-5"></i>
                            Exemples
                        </h4>
                        <div class="space-y-2">
                            ${currentMode.examples.map(example => `
                                <button onclick="window.open('${example.url}', '_blank')" class="w-full text-left p-3 bg-slate-800/60 hover:bg-slate-800 border border-slate-700 hover:border-violet-500/50 rounded-lg transition-all group">
                                    <div class="flex items-center justify-between">
                                        <div>
                                            <div class="font-medium text-slate-200 group-hover:text-violet-300 transition-colors">${example.title}</div>
                                            ${example.artist ? `<div class="text-sm text-slate-400 mt-1">${example.artist}</div>` : ''}
                                        </div>
                                        <i data-lucide="external-link" class="w-4 h-4 text-slate-500 group-hover:text-violet-400 transition-colors"></i>
                                    </div>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        };
        
        // Initial Render
        renderApp();

    </script>
</body>
</html>
